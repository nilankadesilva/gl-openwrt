name: flint4 watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: flint4-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flint4-main
          fetch-depth: 300
          fetch-tags: true
      - name: fetch upstream main
        run: |
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch -q --depth=3000 upstream main
          git merge-base HEAD upstream/main >/dev/null || { git fetch -q --deepen=5000 upstream main; git fetch -q --deepen=2000 origin flint4-main; }
      - name: report
        run: bash .flint4/watch.sh && cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: post to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # REST only (the GraphQL path used by gh issue create/list is not available to the job token here)
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=flint4-watch&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="flint4 watch: upstream changes since the last image" -f body="Daily report from the flint4 watch workflow lands here as comments." -f 'labels[]=flint4-watch' --jq .number)
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -F body=@report.md --jq .html_url
          grep -qiE '^- .*(CVE|security|vuln)' report.md && echo "::warning::security-flagged upstream commits since the last image" || true
